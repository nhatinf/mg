<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Thu Chi</title>
    <!-- Font chữ & Icon -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Chart.js để vẽ biểu đồ đẹp mắt -->
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="user-info">
                <img src="https://unsplash.com" alt="Avatar" class="avatar">
                <div>
                    <span class="welcome">Xin chào,</span>
                    <h2 class="username">Người dùng</h2>
                </div>
            </div>
            <button class="notification-btn"><i class="fa-regular fa-bell"></i></button>
        </header>

        <!-- Thẻ tổng số dư (Ví điện tử phong cách Neomorphism/Glassmorphism) -->
        <div class="balance-card">
            <p class="card-label">Tổng số dư khả dụng</p>
            <h1 class="total-balance" id="totalBalance">0đ</h1>
            <div class="card-stats">
                <div class="stat-item income">
                    <i class="fa-solid fa-arrow-down"></i>
                    <div>
                        <span>Thu nhập</span>
                        <p id="totalIncome">0đ</p>
                    </div>
                </div>
                <div class="stat-item expense">
                    <i class="fa-solid fa-arrow-up"></i>
                    <div>
                        <span>Chi tiêu</span>
                        <p id="totalExpense">0đ</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vùng đồ thị báo cáo -->
        <div class="chart-section">
            <h3 class="section-title">Phân tích chi tiêu</h3>
            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <!-- Danh sách lịch sử giao dịch -->
        <div class="history-section">
            <div class="section-header">
                <h3 class="section-title">Lịch sử giao dịch</h3>
                <span class="see-all">Tất cả</span>
            </div>
            <div class="transaction-list" id="transactionList">
                <!-- Giao dịch trống hoặc danh sách nạp từ JS -->
                <div class="empty-state" id="emptyState">
                    <i class="fa-regular fa-folder-open"></i>
                    <p>Chưa có giao dịch nào được nhập</p>
                </div>
            </div>
        </div>

        <!-- Nút thêm giao dịch nổi bật (Float Action Button) -->
        <button class="fab-btn" id="openModalBtn">
            <i class="fa-solid fa-plus"></i>
        </button>

        <!-- Cửa sổ nhập liệu (Modal Popup bám đáy mobile) -->
        <div class="modal" id="transactionModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Thêm giao dịch mới</h3>
                    <button class="close-btn" id="closeModalBtn">&times;</button>
                </div>
                <form id="transactionForm">
                    <!-- Chọn loại giao dịch hình thức Tabs -->
                    <div class="type-tabs">
                        <label class="tab-label active">
                            <input type="radio" name="type" value="income" checked> Thu nhập
                        </label>
                        <label class="tab-label">
                            <input type="radio" name="type" value="expense"> Chi tiêu
                        </label>
                    </div>

                    <div class="input-group">
                        <label>Số tiền (đ)</label>
                        <input type="number" id="amount" placeholder="0" required min="1">
                    </div>

                    <div class="input-group">
                        <label>Danh mục</label>
                        <select id="category" required>
                            <option value="Lương">💰 Lương / Thưởng</option>
                            <option value="Ăn uống">🍔 Ăn uống</option>
                            <option value="Di chuyển">🚗 Di chuyển</option>
                            <option value="Mua sắm">🛍️ Mua sắm</option>
                            <option value="Giải trí">🎬 Giải trí</option>
                            <option value="Khác">✨ Khoản chi khác</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Ghi chú ngắn</label>
                        <input type="text" id="description" placeholder="Nhập lý do thu/chi...">
                    </div>

                    <button type="submit" class="submit-btn">Lưu giao dịch</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
