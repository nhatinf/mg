<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Hệ Thống</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col justify-between min-h-screen p-6">

    <!-- KHU VỰC TRÊN: LOGO & CHÀO MỪNG -->
    <div class="w-full max-w-sm mx-auto pt-12 text-center">
        <!-- Logo Giả Lập -->
        <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-indigo-100 mb-6">
            <i class="fa-solid fa-chart-pie text-white text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Chào mừng trở lại</h1>
        <p class="text-sm text-gray-500 mt-1">Vui lòng đăng nhập để quản lý doanh thu</p>
    </div>

    <!-- KHU VỰC GIỮA: NÚT ĐĂNG NHẬP GMAIL CHÍNH -->
    <div class="w-full max-w-sm mx-auto space-y-4 my-auto">
        <!-- Nút Đăng nhập bằng Google (Gmail) -->
        <button id="google-login-btn" class="w-full flex items-center justify-center space-x-3 bg-white border border-gray-300 text-gray-700 font-semibold py-3.5 px-4 rounded-xl shadow-sm active:scale-[0.98] active:bg-gray-50 transition-all duration-150">
            <!-- Icon Google chuẩn màu -->
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#EA4335" d="M12.24 10.285V14.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l3.227-3.111C18.263 1.157 15.45 0 12.24 0 5.48 0 0 5.373 0 12s5.48 12 12.24 12c7.06 0 11.758-4.918 11.758-11.83 0-.796-.086-1.405-.19-1.885H12.24Z"/>
            </svg>
            <span class="text-sm">Tiếp tục với Google (Gmail)</span>
        </button>

        <!-- Dấu gạch ngang phân cách (Nếu sau này bạn muốn thêm đăng nhập bằng mật khẩu) -->
        <div class="relative flex py-2 items-center">
            <div class="flex-grow border-t border-gray-200"></div>
            <span class="flex-shrink mx-4 text-gray-400 text-xs uppercase tracking-wider">Hoặc truy cập nhanh</span>
            <div class="flex-grow border-t border-gray-200"></div>
        </div>

        <!-- Nút Demo đi thẳng vào ứng dụng (Dành cho nhà phát triển/kiểm thử) -->
        <button onclick="window.location.href='index.html'" class="w-full bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-medium py-3 px-4 rounded-xl text-xs text-center transition-colors">
            Vào thẳng Dashboard (Giao diện Demo)
        </button>
    </div>

    <!-- KHU VỰC DƯỚI: ĐIỀU KHOẢN & BẢO MẬT -->
    <div class="w-full max-w-sm mx-auto text-center pt-6">
        <p class="text-[11px] text-gray-400 leading-relaxed">
            Bằng cách tiếp tục, bạn đồng ý với <a href="#" class="underline text-gray-500">Điều khoản dịch vụ</a> và <a href="#" class="underline text-gray-500">Chính sách bảo mật</a> của chúng tôi.
        </p>
    </div>

    <!-- SCRIPT XỬ LÝ SỰ KIỆN ĐĂNG NHẬP -->
    <script>
        document.getElementById('google-login-btn').addEventListener('click', function() {
            // Hiệu ứng tải (Loading) giả lập khi user bấm vào
            this.disabled = true;
            this.innerHTML = `
                <i class="fa-solid fa-circle-notch animate-spin text-gray-500 text-lg"></i>
                <span class="text-sm text-gray-500">Đang kết nối tới Google...</span>
            `;
            
            // Giả lập sau 1.5 giây xác thực thành công sẽ chuyển hướng sang trang doanh thu
            setTimeout(() => {
                window.location.href = 'index.html'; 
            }, 1500);
        });
    </script>
</body>
</html>
