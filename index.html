<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống</title>
    <!-- Tailwind CSS cho giao diện Mobile-First -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex flex-col justify-between min-h-screen font-sans antialiased text-slate-800">

    <!-- KHU VỰC ĐĂNG NHẬP (MẶC ĐỊNH HIỂN THỊ) -->
    <main id="login-screen" class="flex-grow flex items-center justify-center px-6">
        <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl p-8 border border-slate-100 flex flex-col items-center">
            <!-- Logo / Biểu tượng -->
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mb-6 shadow-sm">
                <!-- <svg xmlns="http://w3.org" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /> -->
                </svg>
            </div>
            
            <h1 class="text-2xl font-bold text-center mb-2 tracking-tight">Chào mừng quay trở lại</h1>
            <p class="text-sm text-slate-500 text-center mb-8">Đăng nhập nhanh chóng và bảo mật qua tài khoản Google của bạn.</p>

            <!-- Nút Đăng nhập Google -->
            <button id="btn-google-login" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium py-3.5 px-4 rounded-xl shadow-sm transition-all active:scale-[0.98]">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M5.266 9.765A7.077 7.077 0 0 1 12 4.909c1.69 0 3.218.6 4.418 1.582L19.91 3A11.934 11.934 0 0 0 12 0C7.305 0 3.255 2.514 1.04 6.223l4.226 3.542z"/>
                    <path fill="#FBBC05" d="M16.04 15.345c-1.045.741-2.42 1.182-4.04 1.182a7.073 7.073 0 0 1-6.714-4.855L1.04 15.214A11.942 11.942 0 0 0 12 24c3.486 0 6.44-1.127 8.655-3.082l-4.614-5.573z"/>
                    <path fill="#4285F4" d="M23.764 12.218c0-.818-.073-1.609-.209-2.373H12v4.5h6.6c-.286 1.505-1.132 2.777-2.4 3.627l4.615 5.573c2.7-2.491 4.25-6.155 4.25-10.455z"/>
                    <path fill="#34A853" d="M5.286 11.673a7.01 7.01 0 0 1 0-2.318L1.06 5.813A11.966 11.966 0 0 0 0 12c0 2.21.6 4.282 1.655 6.082l3.631-4.409z"/>
                </svg>
                Tiếp tục với Google
            </button>
        </div>
    </main>

    <!-- KHU VỰC SAU KHI ĐĂNG NHẬP (MẶC ĐỊNH ẨN) -->
    <main id="dashboard-screen" class="hidden flex-grow flex items-center justify-center px-6">
        <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl p-8 border border-slate-100 flex flex-col items-center">
            <img id="user-avatar" class="w-20 h-20 rounded-full border-4 border-blue-100 shadow-md mb-4" src="" alt="Avatar">
            <h2 id="user-name" class="text-xl font-bold mb-1">...</h2>
            <p id="user-email" class="text-sm text-slate-500 mb-6">...</p>
            
            <div class="w-full bg-slate-50 rounded-xl p-4 mb-6 border border-slate-100 text-center">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">Dữ liệu từ CSDL</span>
                <p id="db-status" class="text-sm text-emerald-600 font-medium">Đang đồng bộ dữ liệu...</p>
            </div>

            <button id="btn-logout" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-3 rounded-xl transition-all active:scale-[0.98]">
                Đăng xuất
            </button>
        </div>
    </main>

    <!-- Footer bản quyền -->
    <footer class="py-4 text-center text-xs text-slate-400 border-t border-slate-100 bg-white">
        &copy; 2026 Ứng dụng thử nghiệm
    </footer>

    <!-- Tích hợp Firebase SDK bằng Modules -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com"";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://gstatic.com";
        import { getFirestore, doc, setDoc, getDoc } from "https://gstatic.com"";

        // Bước 3: Thay thế thông tin cấu hình Firebase của bạn vào đây
        const firebaseConfig = {
            const firebaseConfig = {
          apiKey: "AIzaSyCtvvb3vC3-yPDkKfQZlAWrlWeYnCPvYeE",
          authDomain: "mggg-fe8f6.firebaseapp.com",
          projectId: "mggg-fe8f6",
          storageBucket: "mggg-fe8f6.firebasestorage.app",
          messagingSenderId: "81114045852",
          appId: "1:81114045852:web:c10cca616f8db385693c59"
        };
        
        // Khởi tạo các dịch vụ Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Lấy các phần tử DOM giao diện
        const loginScreen = document.getElementById('login-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const btnLogin = document.getElementById('btn-google-login');
        const btnLogout = document.getElementById('btn-logout');
        
        const userAvatar = document.getElementById('user-avatar');
        const userName = document.getElementById('user-name');
        const userEmail = document.getElementById('user-email');
        const dbStatus = document.getElementById('db-status');

        // Hàm xử lý Đăng nhập Google
        btnLogin.addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    console.log("Đăng nhập thành công!");
                })
                .catch((error) => {
                    console.error("Lỗi đăng nhập: ", error.message);
                    alert("Đăng nhập thất bại, vui lòng thử lại.");
                });
        });

        // Hàm xử lý Đăng xuất
        btnLogout.addEventListener('click', () => {
            signOut(auth);
        });

        // Lắng nghe trạng thái thay đổi đăng nhập của người dùng
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Chuyển đổi màn hình giao diện sang Dashboard
                loginScreen.classList.add('hidden');
                dashboardScreen.classList.remove('hidden');

                // Hiển thị thông tin cơ bản từ Google Auth
                userName.innerText = user.displayName;
                userEmail.innerText = user.email;
                userAvatar.src = user.photoURL || 'https://placeholder.com';

                // Lưu hoặc cập nhật thông tin người dùng vào CSDL Firestore miễn phí
                const userDocRef = doc(db, "users", user.uid);
                try {
                    await setDoc(userDocRef, {
                        uid: user.uid,
                        name: user.displayName,
                        email: user.email,
                        photo: user.photoURL,
                        lastLogin: new Date().toISOString()
                    }, { merge: true }); // Merge giúp không ghi đè mất các trường dữ liệu cũ khác nếu có

                    dbStatus.innerText = "✓ Đã lưu thông tin vào Cloud Firestore";
                    dbStatus.className = "text-sm text-emerald-600 font-medium";
                } catch (e) {
                    console.error("Lỗi ghi CSDL: ", e);
                    dbStatus.innerText = "✕ Không thể kết nối CSDL";
                    dbStatus.className = "text-sm text-rose-500 font-medium";
                }

            } else {
                // Quay lại màn hình đăng nhập nếu chưa xác thực
                loginScreen.classList.remove('hidden');
                dashboardScreen.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
