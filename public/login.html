<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Hệ Thống - Đăng Nhập / Đăng Ký</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="login-card">
        <div class="login-header">
            <h2 id="cardTitle">🔐 Đăng Nhập Admin</h2>
        </div>
        <div id="alertBox" class="alert hidden"></div>

        <!-- FORM ĐĂNG NHẬP -->
        <form id="formLogin" onsubmit="loginAdmin(event)">
            <div class="form-group"><label>Tên tài khoản</label><input type="text" id="logUser" required></div>
            <div class="form-group"><label>Mật khẩu</label><input type="password" id="logPass" required></div>
            <button type="submit" class="btn btn-primary">Đăng Nhập</button>
            <div class="form-switch-links">
                <span onclick="toggleForm('forgot')">Quên mật khẩu?</span> | 
                <span onclick="toggleForm('register')">Tạo tài khoản Admin mới</span>
            </div>
        </form>

        <!-- FORM QUÊN MẬT KHẨU -->
        <form id="formForgot" class="hidden" onsubmit="forgotPassword(event)">
            <div class="form-group"><label>Tài khoản cần cấp lại pass</label><input type="text" id="forUser" required></div>
            <button type="submit" class="btn btn-warning">Gửi mật khẩu mới (Mặc định: 123456)</button>
            <div class="form-switch-links">
                <span onclick="toggleForm('login')">Quay lại đăng nhập</span>
            </div>
        </form>

        <!-- FORM TẠO TÀI KHOẢN ADMIN -->
        <form id="formRegister" class="hidden" onsubmit="registerAdmin(event)">
            <div class="form-group"><label>Tài khoản Admin mới</label><input type="text" id="regUser" required></div>
            <div class="form-group"><label>Mật khẩu</label><input type="password" id="regPass" required></div>
            <button type="submit" class="btn btn-success">Đăng Ký Admin</button>
            <div class="form-switch-links">
                <span onclick="toggleForm('login')">Quay lại đăng nhập</span>
            </div>
        </form>
    </div>

    <script>
        function toggleForm(type) {
            document.getElementById('formLogin').classList.toggle('hidden', type !== 'login');
            document.getElementById('formForgot').classList.toggle('hidden', type !== 'forgot');
            document.getElementById('formRegister').classList.toggle('hidden', type !== 'register');
            document.getElementById('alertBox').classList.add('hidden');

            const titles = { login: '🔐 Đăng Nhập Admin', forgot: '🔄 Khôi Phục Mật Khẩu', register: '📝 Tạo Tài Khoản Admin' };
            document.getElementById('cardTitle').innerText = titles[type];
        }

        async function loginAdmin(e) {
            e.preventDefault();
            const user = document.getElementById('logUser').value.trim();
            const pass = document.getElementById('logPass').value.trim();
            const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({user, pass}) }).then(r => r.json());
            
            const box = document.getElementById('alertBox');
            box.classList.remove('hidden');
            if(res.success) {
                box.className = 'alert success'; box.innerText = 'Đăng nhập thành công! Đang chuyển hướng...';
                setTimeout(() => location.href = 'dashboard.html', 800);
            } else {
                box.className = 'alert error'; box.innerText = res.msg;
            }
        }

        async function forgotPassword(e) {
            e.preventDefault();
            const user = document.getElementById('forUser').value.trim();
            const res = await fetch('/api/forgot', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({user}) }).then(r => r.json());
            const box = document.getElementById('alertBox');
            box.classList.remove('hidden');
            box.className = res.success ? 'alert success' : 'alert error';
            box.innerText = res.msg;
        }

        async function registerAdmin(e) {
            e.preventDefault();
            const user = document.getElementById('regUser').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            const res = await fetch('/api/register-admin', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({user, pass}) }).then(r => r.json());
            const box = document.getElementById('alertBox');
            box.classList.remove('hidden');
            box.className = res.success ? 'alert success' : 'alert error';
            box.innerText = res.msg;
            if(res.success) setTimeout(() => toggleForm('login'), 1200);
        }
    </script>
</body>
</html>
